spring:
  application:
    name: pluto-template

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs

# Door 1 of reference-scenario: the token settings. Exactly one of the key and the key-set address, plus the
# issuer and the audience. The service does not start without them; nothing here has a usable default.
pluto:
  security:
    jwt:
      public-key: ${PLUTO_JWT_PUBLIC_KEY:}
      jwk-set-uri: ${PLUTO_JWT_JWK_SET_URI:}
      issuer: ${PLUTO_JWT_ISSUER:}
      audience: ${PLUTO_JWT_AUDIENCE:}

# Door 3 of the pack: nothing below is read by the domain or the application layer.
downstream:
  translator:
    base-url: ${TRANSLATOR_URL:http://localhost:9090}
    timeout: 2000ms
    retry-attempts: 3
    retry-wait: 50ms

aws:
  greetings-bucket: ${GREETINGS_BUCKET:greetings}
